onboarding = false

[ui.toast]
delivery = "herdr"

[theme]
name = "gruvbox"
auto_switch = false

[ui.sound]
enabled = false

[ui]
prompt_new_workspace_name = true   # tmux: prefix S prompts for a name
prompt_new_tab_name = true         # tmux: prefix c prompts for a name

# Mirrors tmux/tmux.conf. herdr workspace = tmux session, tab = tmux window.
[keys]
prefix = "ctrl+b"
new_tab = "prefix+c"
reload_config = "prefix+shift+r"
switch_tab = "prefix+1..9"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
detach = "prefix+ctrl+d"
rename_tab = "prefix+r"
resize_mode = "prefix+ctrl+r"         # was prefix+r, freed for rename_tab
new_workspace = "prefix+shift+s"
close_workspace = "prefix+shift+k"    # confirm_close is on by default
goto = "prefix+w"                     # tmux prefix w = session/window tree
workspace_picker = "prefix+g"         # swapped with goto
previous_workspace = "ctrl+shift+alt+k"
next_workspace = "ctrl+shift+alt+j"

# tmux "prefix v" = copy mode. edit_scrollback opens ${EDITOR:-vi} on the buffer.
# Splits move to tmux's defaults: % = side by side, " = stacked.
copy_mode = "prefix+v"
edit_scrollback = "prefix+e"
split_vertical = "prefix+percent"
split_horizontal = 'prefix+"'        # literal "; "quote" means '

previous_tab = "ctrl+alt+h"
next_tab = "ctrl+alt+l"
move_tab_previous = "ctrl+shift+h"
move_tab_next = "ctrl+shift+l"
